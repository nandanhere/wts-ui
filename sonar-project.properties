sonar.projectKey=wts-ui
sonar.projectName=WTS UI
sonar.sourceEncoding=UTF-8

# Keep analysis focused on first-party application code.
sonar.sources=crates,src,src-tauri,ui/src,scripts
sonar.tests=crates,ui/src
sonar.test.inclusions=**/*test*.rs,**/*test*.ts,**/*test*.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/*.lock,**/.todo/**,**/evidence/**,**/*.png

# Coverage is optional until the repository publishes stable Rust and UI
# coverage reports. The scan remains useful for quality and security rules.
