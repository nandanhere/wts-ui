name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify
        run: make airflow

      - name: Bump version and tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force --tags origin

          if latest=$(git describe --tags --abbrev=0 2>/dev/null); then
            commits_since=$(git rev-list "${latest}..HEAD" --count)
          else
            latest="v0.0.0"
            commits_since=$(git rev-list HEAD --count)
          fi

          if [[ ! "$latest" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Latest tag is not semantic versioning compatible: $latest" >&2
            exit 1
          fi

          bump="${{ inputs.bump }}"
          if [ -z "$bump" ]; then
            bump=patch
          fi

          if [ "$commits_since" = "0" ]; then
            release_state=$(gh release view "$latest" --json isDraft --jq '.isDraft' 2>/dev/null || true)
            if [ "$latest" != "v0.0.0" ] && [ "$release_state" != "false" ]; then
              echo "Release ${latest} is missing or still draft — retrying publication."
              echo "released=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No changes since ${latest} — nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r major minor patch <<< "${latest#v}"

          case "$bump" in
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "Releasing ${next} (${commits_since} commits since ${latest})"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${next}" -m "Release ${next}"
          git push origin "${next}"
          echo "released=true" >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: tag
    if: needs.tag.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify
        run: make airflow

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
