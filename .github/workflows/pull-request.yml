name: Pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wts-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-and-critical-browser:
    name: Deterministic contracts and browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out WTS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Use Rust 1.95
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (was @master)
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Install Chromium and system dependencies
        run: npm --prefix ui exec -- playwright install --with-deps chromium

      - name: Run the pull-request gate
        env:
          CI: "true"
          WTS_SKIP_PERFORMANCE: "0"
        run: bash scripts/test-pr.sh

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pull-request-browser-failure-${{ github.run_attempt }}
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: warn
          retention-days: 14

  macos-native:
    name: macOS native contracts and build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out WTS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Use Rust 1.95
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (was @master)
        with:
          toolchain: 1.95.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Run the macOS gate
        env:
          CI: "true"
        run: bash scripts/test-macos.sh

      - name: Install WebKit for desktop layout checks
        run: npm --prefix ui exec -- playwright install --with-deps webkit

      - name: Run desktop WebKit layout checks
        run: npm --prefix ui run test:desktop-webkit
