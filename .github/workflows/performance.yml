name: WTS performance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

jobs:
  apple-silicon-profile:
    name: Bounded Apple Silicon profiling matrix
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (was @master)
        with:
          toolchain: 1.95.0
      - name: Run sequential bounded matrix
        run: bash scripts/profile-matrix.sh
      - name: Upload profile reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wts-apple-silicon-profiles-${{ github.run_id }}
          path: target/profiles/macos-arm64
          retention-days: 14
