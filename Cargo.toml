[workspace]
resolver = "3"
members = [
  "crates/wts-app",
  "crates/wts-core",
  "crates/wts-git",
  "crates/wts-integrations",
  "crates/wts-store",
  "crates/wts-server",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8.9"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1.24", features = ["v4", "serde"] }
